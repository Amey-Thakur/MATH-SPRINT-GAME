<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math Sprint Game - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;overflow:hidden;
      background:url(Source%20Code/img/background_sprint.png) center/cover no-repeat;background-color:#02101f}
.scrim{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(2,14,32,.93) 0%,rgba(2,14,32,.78) 40%,rgba(2,14,32,.30) 66%,rgba(2,14,32,.10) 100%)}
.left{position:absolute;left:76px;top:132px;width:600px}
.tag{font-size:15px;font-weight:700;letter-spacing:.22em;color:#7fd4ff}
.title{margin-top:16px;font-size:82px;font-weight:800;font-style:italic;line-height:.98;
  color:#fff;letter-spacing:-.02em;text-shadow:0 0 26px rgba(60,170,255,.65),0 4px 0 #0a5ea8}
.stack{margin-top:26px;font-size:17px;font-weight:700;letter-spacing:.14em;color:#5fc4ff}
.by{margin-top:30px;font-size:21px;font-weight:700;color:#eaf6ff;line-height:1.6}
.by span{display:block;font-size:14px;font-weight:600;letter-spacing:.16em;color:#7fa8cc;margin-bottom:9px}
.panel{position:absolute;right:78px;top:96px;width:452px;border-radius:14px;overflow:hidden;
  box-shadow:0 26px 64px rgba(0,0,0,.55);background:#eef4fa}
.hd{background:#1E90FF;color:#fff;font-size:29px;font-weight:800;padding:20px 24px;text-align:center;letter-spacing:.01em}
.bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0;background:#e2ebf4}
.pill{padding:7px 18px;border-radius:999px;font-size:17px;font-weight:700;background:#fff;color:#2b3a4a}
.ok{background:#d8f5e0;color:#1f8b45}.no{background:#fde0e3;color:#c62b3a}
.eq{font-size:31px;font-weight:700;text-align:center;padding:19px 0;color:#8a99a8}
.eq.on{background:#1E90FF;color:#fff}
.btns{display:flex;gap:14px;padding:20px}
.btn{flex:1;text-align:center;padding:15px 0;border-radius:9px;font-size:22px;font-weight:800}
.wrong{border:3px solid #d9333f;color:#d9333f;background:#fff}
.right{background:#22a24a;color:#fff}
</style>
<div class="card">
  <div class="scrim"></div>
  <div class="panel">
    <div class="hd">MATH SPRINT GAME</div>
    <div class="bar"><div class="pill ok">7</div><div class="pill">Time: 12.4s</div><div class="pill no">1</div></div>
    <div class="eq">9 &nbsp;&times;&nbsp; 3 &nbsp;=&nbsp; 27</div>
    <div class="eq on">6 &nbsp;&minus;&nbsp; 1 &nbsp;=&nbsp; 5</div>
    <div class="eq">4 &nbsp;&divide;&nbsp; 2 &nbsp;=&nbsp; 2</div>
    <div class="btns"><div class="btn wrong">Wrong</div><div class="btn right">Right</div></div>
  </div>
  <div class="left">
    <div class="tag">PROJECT</div>
    <div class="title">Math<br>Sprint</div>
    <div class="stack">HTML &middot; CSS &middot; JAVASCRIPT &middot; 2022</div>
    <div class="by"><span>CREATED BY</span>Amey Thakur &middot; Mega Satish</div>
  </div>
</div>
</body>
</html>
